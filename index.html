<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#F04432" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="RegX" />

    <!--
      Deliberately only a title.

      React hoists the tags a page renders into this head rather than merging
      them with what is already here, so anything put here that a page also
      sets ends up in the document twice — and a crawler reading the first copy
      would get this generic text instead of the event. Descriptions, og: and
      twitter: tags therefore belong to the page that knows what to say: the
      public form sets them through Helmet, and the server writes them into
      this file's head for /form/{slug} so the scrapers that never run
      JavaScript still see them.
    -->
    <title>RegX — Event registration, entries and fixtures</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
